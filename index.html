<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1019">
<meta name="description" content="Blaulicht-Jagd: THW gegen Feuerwehr im Labyrinth, mit Katastrophenfall, Ereignissen und Abzeichen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Blaulicht-Jagd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen arcade cabinet for a night operation — HUD strip, maze stage, d-pad. Deliberately single dark look. */
:root{
  --night:#0b1019;
  --panel:#131b29;
  --wall:#22324c;
  --wall-edge:#46659a;
  --thw:#1f58c9;
  --beacon:#ffb627;
  --fire:#e0353d;
  --ink:#e8edf5;
  --muted:#8693aa;
  --f-display:"Saira Stencil One","Arial Narrow",Impact,sans-serif;
  --f-ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--night);overflow:hidden;overscroll-behavior:none}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--night);color:var(--ink);font-family:var(--f-ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud,.radio,.stage,.pad{touch-action:none}

/* HUD */
.hud{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;min-height:40px}
.lives{min-width:0;overflow:hidden}
.stat{display:flex;flex-direction:column;line-height:1;flex:none}
[hidden]{display:none!important}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#score{color:var(--beacon)}
.lives{display:flex;gap:2px;margin-left:auto;align-items:center}
.lives canvas{width:26px;height:22px}
.icon-btn{appearance:none;border:1px solid var(--wall-edge);background:var(--panel);color:var(--ink);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn:focus-visible,.pad button:focus-visible,.cta:focus-visible{outline:2px solid var(--beacon);outline-offset:2px}

/* Stage */
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#cv{display:block;border-radius:6px;background:var(--night)}
.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:rgba(11,16,25,.72);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);touch-action:pan-y}
.card{width:100%;max-width:380px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--wall-edge);border-radius:14px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.eyebrow{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--beacon);font-weight:700}
.card h1,.card h2{margin:0;font-family:var(--f-display);font-weight:400;line-height:.95;text-wrap:balance;letter-spacing:.01em}
.card h1{font-size:32px}
.card h2{font-size:34px}
.card p{margin:0;font-size:16px;line-height:1.28;color:var(--ink)}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:16px}
.legend canvas{width:34px;height:28px}
.legend .pts{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;text-align:right}
.cta{appearance:none;border:0;border-radius:12px;background:var(--beacon);color:#1b1300;font-family:var(--f-ui);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase;padding:11px 16px;cursor:pointer}
.cta:active{transform:translateY(1px)}
.hint{font-size:14px!important;color:var(--muted)!important;text-align:center}
.final{display:flex;gap:18px}
.speed{display:flex;flex-direction:column;gap:5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--night);border:1px solid var(--wall-edge);border-radius:12px;padding:4px}
.seg button{appearance:none;border:0;border-radius:9px;background:transparent;color:var(--muted);font-family:var(--f-ui);font-weight:700;font-size:16px;padding:7px 2px;cursor:pointer;touch-action:manipulation}
.seg button[aria-checked="true"]{background:var(--thw);color:#fff}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button small{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:1px}
.seg button[data-o][aria-checked="true"]{background:var(--beacon);color:#1a1205}
.fld{display:flex;flex-direction:column;gap:5px}
.sub .cta:last-child:nth-child(odd){grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{appearance:none;border:1px solid var(--wall-edge);background:var(--night);color:var(--muted);font:700 14px var(--f-ui);border-radius:999px;padding:5px 10px;cursor:pointer;touch-action:manipulation}
.chips button[aria-pressed="true"]{background:var(--beacon);border-color:var(--beacon);color:#1a1205}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lb li{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;background:var(--night);border:1px solid rgba(70,101,154,.45);border-left:4px solid var(--thw);border-radius:9px;padding:6px 10px}
.lb li.fw{border-left-color:var(--fire)}
.lb li.ort{border-left-color:var(--beacon)}
.lb li.me{box-shadow:inset 0 0 0 2px var(--beacon)}
.lb .rk{font:400 20px var(--f-display);color:var(--muted);text-align:center}
.lb li:nth-child(-n+3) .rk{color:var(--beacon)}
.lb .nm{min-width:0}
.lb .nm b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .nm span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .pt{font:400 22px var(--f-display);color:var(--ink)}
.lbmsg{text-align:center;color:var(--muted);font-size:15px;margin:6px 0}
.lbstat{text-align:center;font-size:14px;color:var(--muted);margin:0}
.fld input{-webkit-user-select:text;user-select:text;appearance:none;width:100%;font:600 16px var(--f-ui);color:var(--ink);background:var(--night);border:1px solid var(--wall-edge);border-radius:10px;padding:10px 12px;outline:none}
.fld input:focus{border-color:var(--beacon)}
.fld input::placeholder{color:var(--muted);opacity:.7}
#mult{font-style:normal;color:var(--beacon);margin-left:4px;letter-spacing:.04em}
.seg button[data-r="fw"][aria-checked="true"]{background:var(--fire)}
.seg button:focus-visible{outline:2px solid var(--beacon);outline-offset:1px}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--wall-edge);font-size:18px;padding:11px 16px}
.btns{display:flex;flex-direction:column;gap:8px}
.final .num{font-size:32px}

/* D-pad */
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,68px));grid-template-rows:48px;gap:8px;justify-content:center;flex:none}
.pad button{appearance:none;border:1px solid var(--wall-edge);background:var(--panel);color:var(--ink);border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0;touch-action:none}
.pad button.on{background:var(--thw);border-color:var(--thw)}
.pad svg{width:22px;height:22px}
.pad .l{grid-column:1;grid-row:1}.pad .u{grid-column:2;grid-row:1}.pad .d{grid-column:3;grid-row:1}.pad .r{grid-column:4;grid-row:1}
.pad .mid{display:none;place-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.1}
/* classic cross, used whenever the screen has the height for it */
.pad.cross{grid-template-columns:repeat(3,66px);grid-template-rows:repeat(3,52px);gap:5px}
.pad.cross .u{grid-column:2;grid-row:1}.pad.cross .l{grid-column:1;grid-row:2}.pad.cross .r{grid-column:3;grid-row:2}.pad.cross .d{grid-column:2;grid-row:3}
.pad.cross .mid{display:grid;grid-column:2;grid-row:2}
.pad.cross svg{width:26px;height:26px}
.board{position:relative;display:block}
.radio{position:absolute;left:0;top:0;right:94px;min-height:100%;z-index:3;pointer-events:none}
.funk{position:absolute;left:0;right:0;top:0;min-height:100%;display:flex;gap:6px;align-items:flex-start;padding:3px 8px;border-radius:7px;background:rgba(11,16,25,.9);border:1px solid var(--wall-edge);font-size:13px;line-height:1.15;color:var(--ink);pointer-events:none}
.funk .tag{flex:none;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#1b1300;background:var(--beacon);border-radius:4px;padding:2px 5px;margin-top:1px}
.toast{position:absolute;left:0;right:0;top:0;min-height:100%;z-index:1;display:flex;justify-content:center;gap:8px;align-items:center;padding:2px 12px 2px 4px;border-radius:8px;background:var(--night);border:1px solid var(--beacon);font-size:15px;font-weight:700;white-space:nowrap;pointer-events:none}
.toast canvas{width:30px;height:30px}
.toast small{color:var(--beacon);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:block;line-height:1}
.veh{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--night);border:1px solid var(--wall-edge);border-radius:12px;padding:4px}
.veh button{appearance:none;border:0;border-radius:9px;background:transparent;color:var(--muted);font-family:var(--f-ui);font-weight:700;font-size:14px;padding:6px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:manipulation}
.veh button canvas{width:40px;height:26px}
.veh button[aria-checked="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--beacon)}
.veh button.locked canvas{opacity:.28}
.veh button.locked span::before{content:"";display:inline-block;width:8px;height:7px;margin-right:4px;border:1.5px solid currentColor;border-radius:1px;vertical-align:0;box-shadow:0 -4px 0 -1.5px var(--night),0 -4px 0 0 currentColor}
.veh button:focus-visible{outline:2px solid var(--beacon);outline-offset:1px}
.vehhint:empty{display:none}
.vehhint{font-size:14px!important;color:var(--muted)!important;margin-top:-4px!important}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub .cta{font-size:15px;padding:9px 8px}
.badges{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.badges canvas{width:40px;height:40px}
.badges b{display:block;font-size:17px}
.badges span{color:var(--muted);font-size:14px;line-height:1.2}
.badges .off b{color:var(--muted)}
.earned{display:flex;flex-wrap:wrap;gap:6px}
.earned div{display:flex;align-items:center;gap:6px;background:var(--night);border:1px solid var(--wall-edge);border-radius:999px;padding:2px 10px 2px 2px;font-weight:700;font-size:15px}
.earned canvas{width:28px;height:28px}
.earned em{font-style:normal;color:var(--beacon);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.unlock{color:var(--beacon)!important;font-weight:700}
.rules{margin:0;padding-left:18px;font-size:16px;line-height:1.3;display:flex;flex-direction:column;gap:6px}
.card.tight .intro{display:none}.card.tight h1{font-size:28px}.card.tight{gap:8px;padding-block:12px}.card.tight .eyebrow{font-size:10px}
.splash{position:absolute;inset:0;z-index:20;background:#05070c;overflow:hidden;display:grid;place-items:center}
.splash .bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);max-width:none;object-fit:cover;filter:blur(18px) brightness(.5);pointer-events:none}
.splash .shot{position:relative}
.splash .shot img{display:block;width:100%;height:100%;max-width:100%}
.hot{position:absolute;appearance:none;background:transparent;border:0;padding:0;margin:0;border-radius:10px;cursor:pointer;touch-action:manipulation}
.hot:focus-visible{outline:3px solid var(--beacon);outline-offset:2px}
.hot:active{background:rgba(255,255,255,.12)}
.hot.mode[aria-pressed="true"]{box-shadow:0 0 0 3px var(--beacon),0 0 18px 4px rgba(255,182,39,.6);animation:tapPulse 1.6s ease-in-out infinite}
.splash .menu{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));appearance:none;border:1px solid var(--wall-edge);background:rgba(5,7,12,.75);color:var(--ink);font-family:var(--f-ui);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border-radius:999px;cursor:pointer}
@keyframes tapPulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.hot.mode[aria-pressed="true"]{animation:none}}
.card{background:linear-gradient(180deg,#18223a 0%,#131b29 55%,#10161f 100%);border:2px solid #2f4a78;box-shadow:0 6px 0 rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04) inset}
.overlay:not([hidden]) .card{animation:cardIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.logo{display:flex;flex-wrap:wrap;gap:0 .3em;font-size:36px!important;line-height:1.05!important;filter:drop-shadow(0 3px 0 #0b1019) drop-shadow(0 0 10px rgba(61,139,255,.35))}
.logo .lb{background:linear-gradient(180deg,#a8dcff,#2f7fef);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .lj{background:linear-gradient(180deg,#ffe86f,#ff9a1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.cta{border:2px solid #0b1019!important;box-shadow:0 4px 0 #0b1019;transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(3px)!important;box-shadow:0 1px 0 #0b1019}
.cta.ghost{box-shadow:0 3px 0 rgba(0,0,0,.5);border-color:#2f4a78!important}
.seg button[aria-checked="true"]{box-shadow:0 2px 0 rgba(0,0,0,.45)}
.num.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
.card.tight .logo{font-size:28px!important}
.splash:not([hidden]){animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.overlay:not([hidden]) .card,.num.bump,.splash:not([hidden]){animation:none}}
@media (max-width:380px){.funk{font-size:12px;line-height:1.1;border-left:3px solid var(--beacon)}.funk .tag{display:none}}
@media (max-height:620px){.funk{font-size:12px}.pad:not(.cross){grid-template-rows:44px}.num{font-size:21px}}
@media (prefers-reduced-motion:reduce){.cta:active{transform:none}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app" id="app">
  <header class="hud">
    <div class="stat"><span class="lbl">Punkte<i id="mult"></i></span><span class="num" id="score">0</span></div>
    <div class="stat"><span class="lbl">Rekord</span><span class="num" id="best">0</span></div>
    <div class="stat"><span class="lbl">Einsatz</span><span class="num" id="level">1</span></div>
    <div class="lives" id="lives" aria-label="Leben"></div>
    <button class="icon-btn" id="mute" aria-label="Ton aus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="cross" d="M17 9l5 6M22 9l-5 6" hidden/></svg>
    </button>
    <button class="icon-btn" id="pause" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <div class="radio" aria-live="polite">
      <div class="funk" id="funk" hidden><span class="tag">Funk</span><span id="funkText"></span></div>
      <div class="toast" id="toast" hidden></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="board" id="board">
      <canvas id="cv" aria-label="Spielfeld"></canvas>
    </div>
  </div>

  <div class="splash" id="splash">
    <img class="bg" id="splashBg" alt="">
    <div class="shot" id="shot">
      <img id="splashImg" src="splash.jpg" alt="Blaulicht-Jagd: Startbild mit THW-Radlader und Feuerwehrautos">
      <button class="hot" id="hotStart" style="left:21.1%;top:73.6%;width:57%;height:9.9%" aria-label="Start"></button>
      <button class="hot mode" id="hotThw" data-r="thw" style="left:3.9%;top:84.2%;width:37.5%;height:7%" aria-label="Modus 1: THW sammelt, Feuerwehr verfolgt"></button>
      <button class="hot" id="hotSwap" style="left:43.6%;top:84.2%;width:13.7%;height:7%" aria-label="Modi umschalten"></button>
      <button class="hot" id="hotBonus" style="left:3.9%;top:91.8%;width:92.4%;height:6.9%" aria-label="Bonuslevel spielen"></button>
      <button class="hot mode" id="hotFw" data-r="fw" style="left:58.6%;top:84.2%;width:38%;height:7%" aria-label="Modus 2: Feuerwehr sammelt, THW verfolgt"></button>
    </div>
    <button class="menu" id="splashMenu">Menü</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="card" id="card"></div>
  </div>

  <div class="pad" id="pad">
    <button class="u" data-d="0" aria-label="Hoch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="l" data-d="1" aria-label="Links"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="mid">oder<br>wischen</div>
    <button class="r" data-d="3" aria-label="Rechts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="d" data-d="2" aria-label="Runter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
</div>

let audioUnlocked = false;
function ensureAudio(){
  // iOS: play game sound like media, also when the ringer switch is on silent (the in-game button still mutes)
  try { if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; } catch(e){}
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ac = null; } }
  if (!ac) return;
  if (ac.state !== 'running') ac.resume().catch(()=>{});
  if (!audioUnlocked){
    // older iOS versions only unlock audio after something was actually played inside a tap
    try {
      const b = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource();
      src.buffer = b; src.connect(ac.destination); src.start(0);
      audioUnlocked = true;
    } catch(e){}
  }
}

let bus = null, noiseBuf = null;
function out(){
  if (!bus){
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 6;
    bus = ac.createGain(); bus.gain.value = 1;
    bus.connect(comp).connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return bus;
}
function tone(f, dur, type='square', vol=0.05, f2=null, delay=0){
  if (muted || !ac) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(out()); o.start(t0); o.stop(t0 + dur + 0.02);
}
// German two-tone horn: a' (440 Hz) and d'' (587 Hz), horn-like timbre through a low-pass filter
function horn(vol){
  if (muted || !ac) return;
  const t0 = ac.currentTime + .02, len = .5;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900; lp.Q.value = 1.2;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0);
  lp.connect(g).connect(out());
  const oscs = [ac.createOscillator(), ac.createOscillator()];
  oscs[0].type = 'square'; oscs[1].type = 'sawtooth'; oscs[1].detune.value = 7;
  const seq = [440, 587, 440, 587];
  seq.forEach((f, i) => {
    const t = t0 + i*len;
    oscs.forEach(o => o.frequency.setValueAtTime(f, t));
    g.gain.setTargetAtTime(vol, t, .015);
    g.gain.setTargetAtTime(vol * .82, t + len*.6, .05);
  });
  g.gain.setTargetAtTime(0.0001, t0 + seq.length*len - .04, .03);
  oscs.forEach(o => { o.connect(lp); o.start(t0); o.stop(t0 + seq.length*len + .2); });
}
// civil-protection siren: rising and falling howl
function siren(cycles, vol){
  if (muted || !ac) return;
  const t0 = ac.currentTime + .02, up = 1.3, down = 1.3;
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
  o.type = 'sawtooth'; o2.type = 'sine';
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
  o.frequency.setValueAtTime(240, t0); o2.frequency.setValueAtTime(480, t0);
  for (let c = 0; c < cycles; c++){
    const t = t0 + c*(up + down);
    o.frequency.linearRampToValueAtTime(460, t + up); o.frequency.linearRampToValueAtTime(260, t + up + down);
    o2.frequency.linearRampToValueAtTime(920, t + up); o2.frequency.linearRampToValueAtTime(520, t + up + down);
  }
  const end = t0 + cycles*(up + down);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + .6);
  g.gain.setValueAtTime(vol, end - .8); g.gain.linearRampToValueAtTime(0.0001, end);
  o.connect(lp); o2.connect(lp); lp.connect(g).connect(out());
  [o, o2].forEach(x => { x.start(t0); x.stop(end + .05); });
}

function squelch(){

  const n = ac.createBufferSource(); n.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = .7;
  const g = ac.createGain(); g.gain.setValueAtTime(.06, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + .2);
  n.connect(bp).connect(g).connect(out()); n.start(t0); n.stop(t0 + .22);

}

function bfsFrom(x0, y0, extraBlock, block2){

  for (let i = 0; i < q.length; i++){
    const [x, y] = q[i];
    for (let d = 0; d < 4; d++){

      if (!passM(nx, ny) || seen.has(k) || rescue.haz.has(k) || k === extraBlock || k === block2) continue;

  }

}

function spreadHazard(){
  const pt = ptile(), nx0 = player.dir >= 0 ? {x: wrapX(player.tx + DX[player.dir]), y: player.ty + DY[player.dir]} : pt;
  const banned = new Set([key(SAMMEL.x, SAMMEL.y), key(8, 7), key(pt.x, pt.y), key(nx0.x, nx0.y), key(player.tx, player.ty)]);
  for (let d = 0; d < 4; d++) banned.add(key(wrapX(pt.x + DX[d]), pt.y + DY[d]));
  ghosts.forEach(g => { if (g.mode === 'off') return; banned.add(key(g.tx, g.ty)); if (g.dir >= 0) banned.add(key(wrapX(g.tx + DX[g.dir]), g.ty + DY[g.dir])); });
  rescue.persons.forEach(p => banned.add(key(p.x, p.y)));
  banned.add(key(VERS.x, VERS.y));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (Math.abs(x - SAMMEL.x) + Math.abs(y - SAMMEL.y) <= 4) banned.add(key(x, y));
  rescue.units.forEach(u => { banned.add(key(u.tx, u.ty)); if (u.dir >= 0) banned.add(key(wrapX(u.tx + DX[u.dir]), u.ty + DY[u.dir])); });
  const front = [];
  rescue.haz.forEach(k => {
    const x = k % W, y = (k / W) | 0;
    for (let d = 0; d < 4; d++){
      const nx = wrapX(x + DX[d]), ny = y + DY[d], nk = key(nx, ny);
      if (!passM(nx, ny) || rescue.haz.has(nk) || banned.has(nk) || inHouseZone(nx, ny) || ny === TUN_Y) continue;
      front.push(nk);
    }
  });
  // the fire / rubble creeps towards the people who still wait, with some randomness
  const waiting = rescue.persons.filter(p => p.state === 'wait');
  const score = k => { const x = k % W, y = (k / W) | 0; return (waiting.length ? Math.min(...waiting.map(p => Math.abs(p.x - x) + Math.abs(p.y - y))) : 0) + Math.random() * 5; };
  const order = [...new Set(front)].map(k => [k, score(k)]).sort((a, b) => a[1] - b[1]).map(a => a[0]);
  front.length = 0; front.push(...order);
  const need = [key(SAMMEL.x, SAMMEL.y), key(VERS.x, VERS.y), ...waiting.map(p => key(p.x, p.y))];
  for (const k of front){
    const seen = bfsFrom(player.tx, player.ty, k);
    if (!need.every(n => seen.has(n))) continue;
    /* waiting people must stay reachable from the clinic without passing VS (else the crate gets in the way) */
    const viaClinic = bfsFrom(SAMMEL.x, SAMMEL.y, k, key(VERS.x, VERS.y));
    if (waiting.every(p => viaClinic.has(key(p.x, p.y)))){ rescue.haz.add(k); return; }
  }
}

// allied units: drive to the edge of the fire / flood, fight it, get tired without supplies
const hazNext = (x, y) => { for (let d = 0; d < 4; d++){ const k = key(wrapX(x + DX[d]), y + DY[d]); if (rescue.haz.has(k) && !rescue.src.has(k)) return true; } return false; };
function unitTick(u, dt){
  if (u.state === 'tired') return;
  if (u.state === 'work'){
    if (!hazNext(u.tx, u.ty)){ u.state = 'drive'; u.aim = null; u.dir = -1; return; }
    u.kraft -= dt * 100 / KRAFT_TIME * TEMPI[tempo].m;
    if (u.kraft <= 0){ u.kraft = 0; u.state = 'tired'; u.aim = null; rescue.everTired = true; funk('tired'); return; }
    u.workT -= dt;
    if (u.workT <= 0){
      u.workT = WORK_T;
      // fight the neighbouring hazard tile that is closest to a waiting person
      const waiting = rescue.persons.filter(p => p.state === 'wait');
      let bestK = -1, bv = Infinity;
      for (let d = 0; d < 4; d++){
        const nx = wrapX(u.tx + DX[d]), ny = u.ty + DY[d], k = key(nx, ny);
        if (!rescue.haz.has(k) || rescue.src.has(k)) continue;
        const v = waiting.length ? Math.min(...waiting.map(p => Math.abs(p.x - nx) + Math.abs(p.y - ny))) : 0;
        if (v < bv){ bv = v; bestK = k; }
      }
      if (bestK >= 0){ rescue.haz.delete(bestK); u.aim = bestK; }
    }
    return;
  }
  move(u, UNIT_V * TEMPI[tempo].m * dt, unitArrive);
}
function unitArrive(u){
  if (u.kraft > 0 && hazNext(u.tx, u.ty)){ u.state = 'work'; u.dir = -1; u.prog = 0; u.workT = WORK_T * .5; return; }
  // path to the nearest free spot at the hazard front, not taken by another unit
  const claimed = new Set();
  rescue.units.forEach(o => { if (o === u) return; claimed.add(key(o.tx, o.ty)); if (o.target != null) claimed.add(o.target); });
  const start = key(u.tx, u.ty), par = new Map([[start, -1]]), q = [[u.tx, u.ty]];
  let goal = -1;
  for (let i = 0; i < q.length && goal < 0; i++){
    const [x, y] = q[i];
    for (let d = 0; d < 4; d++){
      const nx = wrapX(x + DX[d]), ny = y + DY[d], k = key(nx, ny);
      if (par.has(k) || !canPlayer(nx, ny)) continue;
      par.set(k, key(x, y)); q.push([nx, ny]);
      if (hazNext(nx, ny) && !claimed.has(k)){ goal = k; break; }
    }
  }
  u.target = goal >= 0 ? goal : null;
  if (goal < 0){ u.dir = -1; return; }
  let k = goal; while (par.get(k) !== start) k = par.get(k);
  const nx = k % W, ny = (k / W) | 0;
  for (let d = 0; d < 4; d++) if (wrapX(u.tx + DX[d]) === nx && u.ty + DY[d] === ny){ u.dir = d; return; }
  u.dir = -1;
}

function move(e, dist, arrive){
  let guard = 0;
  while (dist > 0 && guard++ < 8){
    if (e.dir < 0){ arrive(e); if (e.dir < 0) return; }
    const rem = 1 - e.prog;
    if (dist < rem){ e.prog += dist; return; }
    dist -= rem; e.prog = 0;

function helperArrive(g){

    kat.gaps.forEach(gp => { if (gp.n >= KAT_PER_GAP) return; const v = GAP_DIST[gp.i][g.ty][g.tx] + gp.n * 3; if (v < bestV){ bestV = v; map = GAP_DIST[gp.i]; } });

async function sbRpc(fn, args){
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const to = setTimeout(() => ctl && ctl.abort(), 8000);
  try {
    const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:{'apikey': SB_KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(args || {}), signal: ctl ? ctl.signal : undefined});
    if (!res.ok) return {ok:false, status:res.status};
    return {ok:true, data: await res.json()};
  } catch(e){ return {ok:false, status:0}; }
  finally { clearTimeout(to); }
}
function lbQueue(){ try { const q = JSON.parse(store.get('radlader-lbq', '[]')); return Array.isArray(q) ? q : []; } catch(e){ return []; } }
let lbBusy = false, lbRetry = null;
async function lbFlush(){
  if (lbBusy) return 'busy';
  let q = lbQueue(); if (!q.length) return 'empty';
  lbBusy = true; let last = 'ok';
  try {
    while (q.length){
      const r = await sbRpc('submit_score', q[0]);
      if (r.ok && r.data === 'ok'){ q.shift(); last = 'ok'; }
      else if (r.ok){ last = 'later'; break; }                         /* zu_schnell / besetzt: try again later */
      else if (r.status >= 400 && r.status < 500 && r.status !== 408 && r.status !== 429){ q.shift(); last = 'rejected'; }
      else { last = 'offline'; break; }
      store.set('radlader-lbq', JSON.stringify(q));
    }
    store.set('radlader-lbq', JSON.stringify(q));
  } finally { lbBusy = false; }
  if (q.length && !lbRetry) lbRetry = setTimeout(() => { lbRetry = null; lbFlush(); }, 130000);
  return last;
}

        b.textContent = row.nick; sm.textContent = [row.org, row.ort].filter(Boolean).join(' · ') || ' ';
      }
      nm.append(b, sm); li.append(rk, nm, pt); list.appendChild(li);
    });
    requestAnimationFrame(fitCard);
  };
  (tab === 'orte' ? sbRpc('ortswertung', {}) : sbRpc('leaderboard', org ? {p_org: org} : {})).then(fill);
}
function showBonusPick(){
  card.innerHTML = `
    <p class="eyebrow">Bonuslevel üben</p>

    <p>Im echten Spiel kommt das Bonuslevel nach Einsatz 2 und wechselt von Spiel zu Spiel.</p>

function showRules(){
  card.innerHTML = `
    <p class="eyebrow">Spielregeln · ${R().name}</p>
    <h2>So läuft der Einsatz</h2>
    <ul class="legend" id="legend"></ul>
    <ul class="rules">
      <li>Vier Einsätze auf vier Karten: Baustelle, Wache, Ortschaft und Industriegebiet. Danach gibt es den Gesamtsieg.</li>
      <li>Nach Einsatz 2 kommt ein Bonuslevel, das von Spiel zu Spiel wechselt. Niemand jagt dich, und ein Leben kostet es nie.</li>
      <li>Rettungsdienst: In der Altstadt wütet ein Großbrand oder ein Hochwasser. Bring die 8 Personen einzeln in die Klinik (blaues H). Hol oben an der Versorgungsstelle (VS) Kisten für die drei Einheiten, sonst geht ihnen die Kraft aus. Ab 5 Geretteten gibt es ein Extraleben, bei 40 % Gefahr ist Schluss.</li>

  const L = $('legend'), T = R().legend;
  [

    [g => drawCan(g, 17, 15, 28, 0), T[3], 'Bonus'],

  ].forEach(([fn, label, pts]) => {

function showBadges(){
  const owned = ownedBadges();

    <p class="eyebrow">Abzeichen · ${R().name}</p>

function earnedHTML(){
  if (!gameBadges.length) return '';
  const unl = gameBadges.flatMap(b => b.unlocked || []);
  return `<div class="speed"><span class="lbl">Abzeichen in diesem Spiel</span><div class="earned" id="earned"></div></div>${unl.length ? `<p class="unlock">Neues Fahrzeug freigeschaltet: ${unl.join(', ')}</p>` : ''}`;
}
function fillEarned(){
  const el = $('earned'); if (!el) return;
  gameBadges.forEach(gb => {
    const b = BADGES.find(x => x.id === gb.id);
    const d = document.createElement('div'); d.appendChild(medal(b, true, 28));
    const t = document.createElement('span'); t.textContent = bName(b); d.appendChild(t);
    if (gb.isNew){ const e = document.createElement('em'); e.textContent = 'neu'; d.appendChild(e); }

  });
}
function showOver(again){
  card.innerHTML = `
    <p class="eyebrow">Einsatz beendet</p>
    <h2>${R().overH}</h2>
    <div class="final">
      <div class="stat"><span class="lbl">Punkte</span><span class="num" style="color:var(--beacon)">${score}</span></div>
      <div class="stat"><span class="lbl">Rekord</span><span class="num">${best}</span></div>
      <div class="stat"><span class="lbl">Einsatz</span><span class="num">${levelLabel()}</span></div>
    </div>
    <p>${score >= best && score > 0 ? 'Neuer Rekord. Sauber geräumt!' : R().overP}</p>

    ${lbStatusHTML()}

    <div class="sub">

  $('lbBtn').addEventListener('click', () => showBoard());
  $('home').addEventListener('click', showTitle);
  $('go').addEventListener('click', () => startGame());
}
function showWin(again){
  card.innerHTML = `
    <p class="eyebrow">Alle ${EINSATZ_N} Einsätze geschafft</p>
    <h2>Gesamtsieg!</h2>
    <div class="final">
      <div class="stat"><span class="lbl">Punkte</span><span class="num" style="color:var(--beacon)">${score}</span></div>
      <div class="stat"><span class="lbl">Rekord</span><span class="num">${best}</span></div>
      <div class="stat"><span class="lbl">Leben übrig</span><span class="num">${lives}</span></div>
    </div>
    <p>${R().winP}</p>
    ${earnedHTML()}
    ${lbStatusHTML()}
    ${speedHTML()}
    <div class="sub">
      <button class="cta" id="go">Nochmal</button>
      <button class="cta ghost" id="home">Startseite</button>
      <button class="cta ghost" id="lbBtn">Bestenliste</button>
    </div>`;
  overlay.hidden = false; requestAnimationFrame(fitCard); card.scrollTop = 0;
  fillEarned(); bindSpeed();
  $('lbBtn').addEventListener('click', () => showBoard());
  $('home').addEventListener('click', showTitle);
  $('go').addEventListener('click', () => startGame());
}
function showPause(){
  card.innerHTML = `
    <p class="eyebrow">Pause</p>
    <h2>Brotzeit</h2>
    <p>Der Radlader wartet. Die Feuerwehr auch.</p>
    ${speedHTML()}
    <div class="btns" id="pauseBtns">
      <button class="cta" id="go">Weiter</button>
      <button class="cta ghost" id="quit">Einsatz abbrechen</button>
    </div>`;
  overlay.hidden = false; requestAnimationFrame(fitCard);
  bindSpeed(); saveRun();
  $('go').addEventListener('click', resume);
  $('quit').addEventListener('click', () => {
    // confirm inside the card, browser dialogs are not reliable here
    $('pauseBtns').innerHTML = `
      <p>Einsatz wirklich abbrechen? Rekord und Abzeichen bleiben erhalten, das laufende Spiel ist dann weg.</p>
      <div class="sub">
        <button class="cta" id="quitYes">Ja, abbrechen</button>
        <button class="cta ghost" id="quitNo">Nein, weiter</button>
      </div>`;
    $('quitYes').addEventListener('click', quitGame);
    $('quitNo').addEventListener('click', resume);

  });
}
function quitToMenu(){
  ev = null; kat = null; $('funk').hidden = true;
  loadMap(1); resetGrid(); resetPositions(); level = 1; setLevelText(); renderLives();
  showTitle();
}
function quitGame(){
  if (practice){ practice = false; state = 'title'; prevState = null; overlay.hidden = true; quitToMenu(); return; }
  clearRun();
  state = 'title'; prevState = null; ev = null; kat = null;
  overlay.hidden = true; $('funk').hidden = true; $('toast').hidden = true;
  loadMap(1); resetGrid(); resetPositions(); level = 1; setLevelText(); renderLives();
  splashEl.hidden = false; markSplashRole(); fitSplash();
}
let wakeLock = null;
function requestWake(){
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => wakeLock = l).catch(()=>{}); } catch(e){}
}
let practice = false;   // 'Bonuslevel üben': play only the bonus level, then back to the menu
function startGame(run, practiceBonus){
  ensureAudio(); sfx.start(); requestWake();
  practice = !!practiceBonus;
  bonusKind = practice ? (BONUS_KINDS.includes(practiceBonus) ? practiceBonus : 'rd')
    : run ? (BONUS_KINDS.includes(run.bk) ? run.bk : 'rd') : nextBonusKind();
  if (run){ const runRole = run.role === 'fw' ? 'fw' : 'thw'; if (runRole !== role) setRole(runRole); }
  score = 0; rawScore = 0; lives = 3; level = 1; showMult();
  gameBadges = []; $('toast').hidden = true; toastT = 0;
  pickPlans();
  loadMap(1); resetGrid();
  if (run && run.grid){
    score = run.score; rawScore = run.raw != null ? run.raw : run.score; lives = run.lives; level = Math.min(Math.max(run.level|0, 1), MAX_LEVEL);
    loadMap(level); resetGrid();
    if (!isRescue()) grid = run.grid.map(r => r.split(''));
    pelletsLeft = 0; for (const r of grid) for (const c of r) if (c === '.' || c === 'o') pelletsLeft++;
    eatenCount = run.eatenCount || 0; bonusSpawned = run.bonusSpawned || 0;
    if (Array.isArray(run.katPlan)) katPlan = run.katPlan.filter(l => l >= level);
    if (run.evPlan && typeof run.evPlan === 'object') evPlan = run.evPlan;
    katPrep(); evPrep(); flooded = !!run.flooded;
    if (!isRescue() && pelletsLeft === 0) resetGrid();
    if (isRescue()){ pelletsLeft = 0; for (const r of grid) for (const c of r) if (c === 'o') pelletsLeft++; }
  }
  if (practice){ clearRun(); level = BONUS_LEVEL; loadMap(level); resetGrid(); }
  elScore.textContent = score; shownScore = score; setLevelText(); elBest.textContent = best; parts.length = 0;
  levelIntro = true;
  resetPositions();
  overlay.hidden = true;
  setState('ready'); renderLives(); pushGuard();
}
function pause(){
  if (!['play','ready','dying','clear'].includes(state)) return;
  prevState = state; state = 'paused'; showPause();
}
function resume(){
  if (state !== 'paused') return;
  ensureAudio(); requestWake();
  overlay.hidden = true; state = prevState; last = performance.now();
}

/* ---------- Input ---------- */
function setWant(d){
  player.want = d;
  document.querySelectorAll('.pad button').forEach(b => b.classList.toggle('on', +b.dataset.d === d));
}
document.querySelectorAll('.pad button').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); setWant(+b.dataset.d); });
});
const KEYS = {ArrowUp:0, KeyW:0, ArrowLeft:1, KeyA:1, ArrowDown:2, KeyS:2, ArrowRight:3, KeyD:3};
const splashEl = $('splash'), shotEl = $('shot'), splashImg = $('splashImg');
$('splashBg').src = splashImg.src;
// show the whole picture (contain) so the drawn buttons are never cut off
function fitSplash(){
  if (splashEl.hidden) return;
  const r = splashEl.getBoundingClientRect(), ar = 768 / 1364;
  let w = r.width, h = w / ar;
  if (h > r.height){ h = r.height; w = h * ar; }
  shotEl.style.width = Math.floor(w) + 'px'; shotEl.style.height = Math.floor(h) + 'px';
}
function markSplashRole(){ splashEl.querySelectorAll('.hot.mode').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.r === role))); }
function closeSplash(){
  if (splashEl.hidden) return;
  splashEl.hidden = true; ensureAudio(); showTitle();
}
function pickSplashRole(r){
  ensureAudio();
  if (r !== role){ setRole(r); sfx.load(); }
  markSplashRole();
}
$('hotThw').addEventListener('click', () => pickSplashRole('thw'));
$('hotFw').addEventListener('click', () => pickSplashRole('fw'));
$('hotSwap').addEventListener('click', () => pickSplashRole(role === 'thw' ? 'fw' : 'thw'));
$('hotStart').addEventListener('click', closeSplash);
$('splashMenu').addEventListener('click', closeSplash);
$('hotBonus').addEventListener('click', () => { if (splashEl.hidden) return; splashEl.hidden = true; ensureAudio(); showBonusPick(); });
markSplashRole(); fitSplash();
window.addEventListener('resize', fitSplash);
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (!splashEl.hidden && (e.code === 'Enter' || e.code === 'Space')){ e.preventDefault(); $('hotStart').click(); return; }
  if (e.code in KEYS){ e.preventDefault(); setWant(KEYS[e.code]); return; }
  if (e.code === 'KeyP' || e.code === 'Escape'){ state === 'paused' ? resume() : pause(); return; }
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'title' || state === 'over' || state === 'won')){ e.preventDefault(); startGame(state === 'title' ? loadRun() : null); }
});
let swipe = null;
const app = $('app');
document.addEventListener('pointerdown', e => {
  if (e.target.closest('button') || e.target.closest('.card')) return;
  swipe = {x: e.clientX, y: e.clientY, id: e.pointerId};
});
document.addEventListener('pointermove', e => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
  setWant(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 1) : (dy > 0 ? 2 : 0));
  swipe.x = e.clientX; swipe.y = e.clientY;
});
['pointerup','pointercancel'].forEach(t => document.addEventListener(t, () => swipe = null));
const blockTouch = e => { const c = e.target.closest && e.target.closest('.card'); if (!c || c.scrollHeight <= c.clientHeight) { if (e.cancelable) e.preventDefault(); } };
document.addEventListener('touchmove', blockTouch, {passive:false});
document.addEventListener('touchstart', e => { if (e.touches.length > 1 && e.cancelable) e.preventDefault(); }, {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());
// back gesture: catch it as pause instead of leaving the game
let guardPushed = false;
function pushGuard(){ if (guardPushed) return; try { history.pushState({radlader:1}, ''); guardPushed = true; } catch(e){} }
window.addEventListener('popstate', () => { guardPushed = false; if (['play','ready','dying','clear'].includes(state)){ pause(); pushGuard(); } });

$('mute').addEventListener('click', () => { muted = !muted; store.set('radlader-mute', muted ? '1' : '0'); setMuteIcon(); if (!muted) ensureAudio(); });
$('pause').addEventListener('click', () => { state === 'paused' ? resume() : pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- Loop ---------- */
let last = performance.now();
let fpsT = 0, fpsN = 0, fpsLow = 0, shownScore = 0;
function frame(now){
  const raw = (now - last) / 1000;
  const dt = Math.min(raw, 1/30); last = now; renderDt = dt;
  if (state === 'play' && fxActive() && raw < .5){
    fpsT += raw; fpsN++;
    if (fpsT >= 2){
      fpsLow = fpsN / fpsT < 40 ? fpsLow + 1 : 0; fpsT = 0; fpsN = 0;
      if (fpsLow >= 2){ fxAuto = false; showNote('Effekte reduziert, damit es flüssig bleibt'); }
    }
  }
  tNow += dt;
  if (funkT > 0 && state !== 'paused'){ funkT -= dt; if (funkT <= 0) $('funk').hidden = true; }
  if (toastT > 0 && state !== 'paused'){ toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
  if (state !== 'paused' && state !== 'title' && state !== 'over' && state !== 'won') update(dt);
  if (state !== 'paused'){ updateParts(dt); if (shakeT > 0) shakeT -= dt; }
  if (shownScore !== score){
    shownScore = score < shownScore ? score : Math.min(score, shownScore + Math.max(1, Math.ceil((score - shownScore) * Math.min(1, dt*9))));
    elScore.textContent = shownScore;
  }
  render();
  requestAnimationFrame(frame);
}

loadMap(1); resetGrid(); resetPositions();
elBest.textContent = best; setLevelText();
// menu cards: switch to a tighter layout when the card does not fit the visible area
function fitCard(){
  card.classList.remove('tight');
  if (!overlay.hidden && card.scrollHeight > card.clientHeight + 2) card.classList.add('tight');
}
window.addEventListener('resize', fitCard);
// cross d-pad when it costs no board size (board limited by width), single row when height is tight
const padEl = $('pad');
function boardScale(){ const r = stage.getBoundingClientRect(); return Math.min(r.width / W, r.height / H); }
function choosePad(){
  padEl.classList.add('cross');
  const sCross = boardScale();
  padEl.classList.remove('cross');
  const sRow = boardScale();
  // the cross is easier to steer with, so accept a slightly smaller board for it
  padEl.classList.toggle('cross', sCross >= sRow * .86);
}
choosePad();
window.addEventListener('resize', choosePad);
new ResizeObserver(() => { resize(); render(); }).observe(stage);
resize(); renderLives(); showTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
requestAnimationFrame(frame);
})();
</script>
<script>
// Offline support: register the service worker; when a new version takes over, reload once
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  // only reload when an older version was running (not on the very first visit)
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || reloaded) return; reloaded = true; location.reload(); });
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
